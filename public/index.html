<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Plactual</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
    <!-- Both deferred, so they run in order: Plaid Link is ready before app.js. -->
    <script src="https://cdn.plaid.com/link/v2/stable/link-initialize.js" defer></script>
    <script src="app.js" defer></script>
  </head>

  <body>
    <div class="container">
      <header>
        <div class="logo">⬡</div>
        <h1>Plactual</h1>
        <div class="status-dot" id="status-dot" title="Server status"></div>
      </header>

      <div class="stats">
        <div class="stat-card">
          <div class="stat-label">Institutions</div>
          <div class="stat-value" id="stat-count">
            <div class="skeleton skeleton--stat-value"></div>
          </div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Environment</div>
          <div id="stat-env">
            <div class="skeleton skeleton--badge"></div>
          </div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Auto-Sync</div>
          <div class="stat-cron" id="stat-cron">
            <div class="skeleton skeleton--cron"></div>
          </div>
        </div>
      </div>

      <div class="section-header">
        <span class="section-title">Linked Accounts</span>
        <button class="icon-btn" id="refresh-btn" disabled title="Refresh Accounts">
          <svg
            width="14"
            height="14"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <polyline points="23 4 23 10 17 10"></polyline>
            <polyline points="1 20 1 14 7 14"></polyline>
            <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
          </svg>
        </button>
        <span class="sync-header-label" id="sync-header-label" hidden>Sync to Actual</span>
      </div>

      <div class="accounts" id="accounts-list">
        <div class="institution-group">
          <div class="institution-header">
            <div class="skeleton skeleton--institution"></div>
          </div>
          <div class="account-row is-skeleton">
            <div class="skeleton skeleton--avatar"></div>
            <div class="account-info">
              <div class="skeleton skeleton--name"></div>
              <div class="skeleton skeleton--id"></div>
            </div>
          </div>
          <div class="account-row is-skeleton">
            <div class="skeleton skeleton--avatar"></div>
            <div class="account-info">
              <div class="skeleton skeleton--name"></div>
              <div class="skeleton skeleton--id"></div>
            </div>
          </div>
        </div>
      </div>

      <div class="actions">
        <button class="btn btn-primary" id="link-btn" disabled>
          <span id="link-btn-text">Link Institution</span>
        </button>
        <button class="btn btn-secondary" id="sync-btn" disabled>
          <span id="sync-btn-text">Sync Now</span>
        </button>
      </div>

      <div class="sync-log" id="sync-log">
        <div class="sync-log-inner" id="sync-log-inner"></div>
      </div>
    </div>

    <div id="toast-container"></div>

    <!-- Cloned by app.js. Filling these with textContent keeps institution and
         account names from Plaid out of the HTML parser. -->
    <template id="tpl-empty-state">
      <div class="empty-state">
        No accounts linked yet.
        <div class="empty-hint">Click "Link Institution" to connect your first bank.</div>
      </div>
    </template>

    <template id="tpl-institution">
      <div class="institution-group">
        <div class="institution-header">
          <span class="institution-name"></span>
          <span class="badge neutral account-count"></span>
          <button type="button" class="btn-reconnect" data-action="reconnect" hidden>
            Reconnect
          </button>
        </div>
      </div>
    </template>

    <template id="tpl-account">
      <div class="account-row">
        <div class="account-icon">🏦</div>
        <div class="account-info">
          <div class="account-name"></div>
          <div class="account-id"></div>
        </div>
        <label class="toggle" title="Toggle sync to Actual">
          <input type="checkbox" data-action="toggle-sync" />
          <span class="slider"></span>
        </label>
      </div>
    </template>
  </body>
</html>
