name: Secret Scan

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  GITLEAKS_VERSION: 8.30.1
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

jobs:
  gitleaks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Full history. A secret that was committed and later deleted is still
          # in the repository, and that is exactly how two Plaid sandbox tokens
          # leaked here once — a scan of the current files alone would miss it.
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          curl -sSfL "$url" -o "$RUNNER_TEMP/$archive"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$archive" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP/bin" gitleaks
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/bin/gitleaks" version

      # --redact keeps any match out of the workflow log, which is world-readable
      # on a public repository. The rules live in .gitleaks.toml; note that the
      # built-in ruleset does not match Plaid access tokens on its own.
      - name: Scan committed history for secrets
        run: gitleaks git . --config .gitleaks.toml --redact --verbose --no-banner

      # The scan above only sees committed content. These two files hold live
      # credentials and are gitignored; this catches the day someone forces one
      # of them in with `git add -f`.
      - name: Check that credential files are not tracked
        run: |
          set -euo pipefail
          tracked="$(git ls-files -- .env db.json)"
          if [ -n "$tracked" ]; then
            echo "::error::These files hold live credentials and must not be tracked: $tracked"
            exit 1
          fi
          echo "No credential files are tracked."
